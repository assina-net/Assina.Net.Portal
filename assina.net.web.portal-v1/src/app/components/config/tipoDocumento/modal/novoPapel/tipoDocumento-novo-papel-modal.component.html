<form autocomplete="off" class="form form-horizontal" #form="ngForm" id="formGroup" novalidate>
    <div class="form-body">
        <app-modal-simples [titulo]="'Cadastro > Contrato > Contrato Partes'" [item]="instance" 
            [form]="form">


            <div>
                <div class="row">
                    <div [ngClass]="[modal?'col-md-12':'col-md-6']">
                        <label for="inputNome" class="control-label">Nome</label>
                        <input type="text" [(ngModel)]="Papel.nome" name="inputNome" class="form-control" id="inputNome"
                            [ngStyle]="classUpperCase()" #nome="ngModel" placeholder="Informe" minlength="3"
                            maxlength="255" required>
                        <small class="form-text text-muted danger"
                            *ngIf="nome.errors?.required && (nome.dirty || nome.touched)">Informe
                            o nome do papel
                        </small>
                        <small class="form-text text-muted danger"
                            *ngIf="nome.errors?.minlength && (nome.dirty || nome.touched)">Informe
                            no mínimo 3 carateres
                        </small>
                    </div>
                </div>

                <div class="row" *ngIf="perfilUsuarioAdmin()">
                    <div [ngClass]="[modal?'col-md-12':'col-md-6']">
                        <label for="inputIdentificacao" class="control-label">Identificação</label>
                        <input type="text" [(ngModel)]="Papel.identificacao" name="inputIdentificacao"
                            [ngStyle]="classUpperCase()" class="form-control" id="inputIdentificacao"
                            #identificacao="ngModel" placeholder="Informe" minlength="3" maxlength="255" required>
                        <small class="form-text text-muted danger"
                            *ngIf="identificacao.errors?.required && (identificacao.dirty || identificacao.touched)">Informe
                            a Identificação
                        </small>
                        <small class="form-text text-muted danger"
                            *ngIf="identificacao.errors?.minlength && (identificacao.dirty || identificacao.touched)">Informe
                            no mínimo 3 carateres
                        </small>
                    </div>
                </div>

                <div class="row" *ngIf="false">
                    <div class="col-md-2">
                        <label for="inputAssina" class="control-label">Solicita Assinatura</label>
                        <ui-switch [(ngModel)]="TipoDocumento.assina" name="inputNaoAssina" id="inputAssina"
                            [ngStyle]="classUpperCase()" #assina="ngModel" class="switch100" required
                            checkedLabel="Assina" uncheckedLabel="Não Assina" defaultBgColor="red">
                        </ui-switch>
                        <small class="form-text text-muted danger"
                            *ngIf="assina.invalid && (assina.dirty || assina.touched)">Escolha o Não Assina
                        </small>
                    </div>
                </div>


                <ngb-alert *ngIf="message" type="{{message.type}}" (close)="message = null">
                    {{ message.text }}
                </ngb-alert>

            </div>
        </app-modal-simples>
    </div>
</form>
