        <div class="form-body col-md-4">

            <form class="form-signin op col-20 col-md-10" #form="ngForm" (ngSubmit)="trocarSenha()" autocomplete="off">

                <div class="input-wrapper" *ngIf="tokenValido">

                    <label for="inputPassword" class="control-label">Senha</label>

                    <div class="input-group mb-0" id="show_hide_password_n" style="flex-wrap:nowrap">
                        <input type="password" [(ngModel)]="senhaNova" name="y" class="form-control" id="inputPassword"
                            placeholder="**********" #senha="ngModel" [required]="!editando" minlength="3"
                            maxlength="30">
                        <div class="input-group-append">
                            <div class="input-group-text" (click)="showHidePassword('n')">
                                <i class="fa fa-eye-slash" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>

                    <small class="form-text text-muted danger"
                        *ngIf="senha.errors?.required && (senha.dirty || senha.touched)">Informe a Senha
                    </small>
                    <small class="form-text text-muted danger"
                        *ngIf="senha.errors?.minlength && (senha.dirty || senha.touched)">Informe no mínimo 6
                        caracteres
                    </small>
                </div>
                <div class="input-wrapper">
                    <div style="margin-top: 28px;">
                        <ng2-password-strength-bar  [passwordToCheck]="senhaNova" [barColors]="barColors"
                            [strengthLabels]="strengthLabels">
                        </ng2-password-strength-bar>
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="inputPasswordC" class="control-label">Confirmar Senha</label>
                    <div class="input-group mb-0" id="show_hide_password_c" style="flex-wrap:nowrap">
                        <input type="password" [(ngModel)]="senhaConfirmacao" name="senhaConfirma" class="form-control"
                            id="inputPasswordC" placeholder="**********" #senhaConfirma="ngModel"
                            [required]="senhaNova != senhaConfirmacao" maxlength="30">
                        <div class="input-group-append">
                            <div class="input-group-text" (click)="showHidePassword('c')">
                                <i class="fa fa-eye-slash" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>
                    <small class="form-text text-muted danger"
                        *ngIf="senhaConfirma.errors?.required && (senhaConfirma.dirty || senhaConfirma.touched)">
                        Informe a Senha de confirmação
                    </small>
                </div>

                <ngb-alert *ngIf="message" type="{{message.type}}" (close)="message = null">
                    {{ message.text }}
                </ngb-alert>

                <div class="form-actions" style="border:0px">
                    <button type="submit" class="btn btn-raised btn-success mr-1" style="padding-top: 0px;">
                        <i class="fa fa-check"></i> Alterar Senha
                    </button>
                </div>

            </form>
        </div>
