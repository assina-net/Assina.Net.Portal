<form autocomplete="off" class="form form-horizontal" #form="ngForm" novalidate>
    <div class="form-body">
        <app-modal-simples [titulo]="'Cadastro > Contrato > Documentos > Visualizar'">

            <label class="control-label">{{documento.nomeDocumento}}</label>
            <div class="document-preview-area">
                <!--<ng2-pdfjs-viewer #pdfViewer viewerId="inline" [print]="true" [fullScreen]="false" [find]="false"></ng2-pdfjs-viewer>-->
                <pdf-viewer [hidden]="message || carregando || !documentoPDF" src="{{documentoPDF}}" original-size="true" show-all="false" [autoresize]="true"
                    [fit-to-page]='true' [render-text]='false'></pdf-viewer>

                <div *ngIf="carregando" class="document-preview-state">
                    Carregando documento...
                </div>

                <ngb-alert *ngIf="message" type="{{message.type}}" class="document-preview-message" (close)="message = null">
                    {{ message.text }}
                </ngb-alert>
            </div>

        </app-modal-simples>
    </div>
</form>
